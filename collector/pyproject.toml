[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E = pycodestyle errors, F = pyflakes, I = isort, W = warnings
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["collector"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
